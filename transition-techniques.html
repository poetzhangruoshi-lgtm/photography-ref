<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>镜头语言全图鉴</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans SC',sans-serif;background:#f5f5f8;color:#1a1a2e;min-height:100vh;overflow-x:hidden}

  /* Header */
  .header{text-align:center;padding:48px 20px 12px}
  .header h1{font-size:40px;font-weight:900;background:linear-gradient(135deg,#60a5fa,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px;margin-bottom:8px}
  .header .subtitle{font-size:15px;color:#555;font-weight:300;letter-spacing:2px}

  /* Layout */
  .layout{display:flex;max-width:1440px;margin:0 auto}
  .sidebar{width:240px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid #eee;padding:20px 0;background:#fafafa;font-size:13px}
  .sidebar::-webkit-scrollbar{width:3px}
  .sidebar::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
  .content{flex:1;min-width:0;padding-bottom:60px}

  .sb-part{padding:16px 16px 4px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#aaa}
  .sb-link{display:block;padding:6px 16px 6px 28px;color:#888;text-decoration:none;cursor:pointer;border-left:2px solid transparent;transition:all .15s;font-size:12.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-link:hover{color:#333;background:rgba(0,0,0,.03)}
  .sb-link.active{color:#7c3aed;border-left-color:#7c3aed;background:rgba(124,58,237,.04);font-weight:500}
  .sb-sub{padding-left:40px;font-size:11.5px;color:#aaa}
  .sb-sub:hover{color:#666}
  .sb-sub.active{color:#7c3aed;border-left-color:#7c3aed;background:rgba(124,58,237,.04)}


  /* Top tabs */
  .top-tabs{display:flex;justify-content:center;gap:8px;padding:12px 20px 0;flex-wrap:wrap}
  .top-tab{padding:8px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid #e0e0e8;color:#999;background:#fff;transition:all .2s;user-select:none}
  .top-tab:hover{border-color:#ccc;color:#666}
  .top-tab.active{border-color:#7c3aed;color:#7c3aed;background:rgba(124,58,237,.04)}

  /* Part header */
  .part{padding:40px 20px 20px}
  .part-header{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
  .part-num{font-size:13px;font-weight:700;color:#aaa;padding:3px 10px;border:1px solid #ddd;border-radius:4px;letter-spacing:1px}
  .part-title{font-size:26px;font-weight:900;letter-spacing:2px}
  .part-desc{font-size:13px;color:#555;margin-bottom:32px;padding-left:2px}

  /* Section (category) */
  .section{padding:0 20px 24px}
  .section-header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;transition:background .2s}
  .section-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .section-title{font-size:18px;font-weight:700;letter-spacing:1px}
  .section-subtitle{font-size:12px;color:#555;font-weight:300;margin-left:6px}
  .section-tag{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;margin-left:auto;white-space:nowrap}

  /* Cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;padding:12px 0 20px}
  .card{background:#fff;border:1px solid #eaeaf0;border-radius:12px;padding:18px;transition:all .3s;cursor:default;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0;opacity:.8}
  .card:hover{border-color:#d0d0da;transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.06)}
  .card-name{font-size:15px;font-weight:700;color:#1a1a2e;margin-bottom:2px}
  .card-name-en{font-size:11px;color:#999;margin-bottom:8px}
  .card-desc{font-size:12.5px;color:#666;line-height:1.7;margin-bottom:10px}
  .card-example{font-size:12px;color:#666;line-height:1.6;padding:8px 10px;background:#f8f8fb;border-radius:6px;border-left:3px solid #e0e0e8;margin-bottom:10px}
  .card-example strong{color:#888}
  .card-extra{font-size:11px;line-height:1.6;padding:6px 9px;border-radius:5px;margin-bottom:6px}
  .card-cognition{background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.15);color:#7c6aaf}
  .card-cognition::before{content:'🧠 ';font-size:12px}
  .card-usage{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.15);color:#3a8ba8}
  .card-usage::before{content:'🎬 ';font-size:12px}
  .card-recipe{background:rgba(244,114,182,.08);border:1px solid rgba(244,114,182,.15);color:#b0608a}
  .card-recipe::before{content:'🧩 ';font-size:12px}

  /* Upload */
  .card-media{margin-bottom:10px}
  .upload-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border:1px dashed #ccc;border-radius:6px;font-size:11px;color:#aaa;cursor:pointer;background:none}
  .upload-btn:hover{border-color:#999;color:#666}
  .upload-btn input[type=file]{display:none}
  .video-gallery{display:flex;gap:10px;margin-top:8px;overflow-x:auto;padding-bottom:4px}
  .video-gallery::-webkit-scrollbar{height:4px}
  .video-gallery::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
  .video-thumb{position:relative;min-width:160px;width:160px;height:100px;border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid #e8e8ee;transition:all .2s;flex-shrink:0;background:#f0f0f4}
  .video-thumb:hover{border-color:#ccc;transform:scale(1.03)}
  .video-thumb video{width:100%;height:100%;object-fit:cover;pointer-events:none}
  .video-thumb .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:28px;height:28px;background:rgba(0,0,0,.5);border-radius:50%;display:flex;align-items:center;justify-content:center}
  .video-thumb .play-icon::after{content:'';width:0;height:0;border-style:solid;border-width:6px 0 6px 10px;border-color:transparent transparent transparent #fff;margin-left:2px}
  .video-thumb .delete-btn{position:absolute;top:4px;right:4px;width:20px;height:20px;background:rgba(239,68,68,.85);border:none;border-radius:50%;color:#fff;font-size:10px;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0}
  .video-thumb:hover .delete-btn{display:flex}
  .video-thumb .vid-label{position:absolute;bottom:0;left:0;right:0;font-size:9px;color:#ccc;background:rgba(0,0,0,.7);padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Tags */
  .card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
  .tag{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500}
  .tag-green{background:rgba(34,197,94,.1);color:#16a34a;border:1px solid rgba(34,197,94,.2)}
  .tag-amber{background:rgba(245,158,11,.1);color:#d97706;border:1px solid rgba(245,158,11,.2)}
  .tag-blue{background:rgba(96,165,250,.1);color:#2563eb;border:1px solid rgba(96,165,250,.2)}
  .tag-gray{background:rgba(0,0,0,.03);color:#888;border:1px solid rgba(0,0,0,.06)}
  .tag-purple{background:rgba(167,139,250,.1);color:#7c3aed;border:1px solid rgba(167,139,250,.2)}
  .tag-pink{background:rgba(244,114,182,.1);color:#db2777;border:1px solid rgba(244,114,182,.2)}

  /* Section color themes */
  [data-color=green] .group-line{background:#22c55e}
  [data-color=green] .section-icon{background:rgba(34,197,94,.1)}
  [data-color=green] .section-title{color:#16a34a}
  [data-color=green] .section-tag{background:rgba(34,197,94,.1);color:#16a34a;border:1px solid rgba(34,197,94,.2)}
  [data-color=green] .card::before{background:#22c55e}

  [data-color=teal] .section-icon{background:rgba(45,212,191,.1)}
  [data-color=teal] .section-title{color:#0d9488}
  [data-color=teal] .section-tag{background:rgba(45,212,191,.1);color:#0d9488;border:1px solid rgba(45,212,191,.2)}
  [data-color=teal] .card::before{background:#2dd4bf}

  [data-color=sky] .section-icon{background:rgba(56,189,248,.1)}
  [data-color=sky] .section-title{color:#0284c7}
  [data-color=sky] .section-tag{background:rgba(56,189,248,.1);color:#0284c7;border:1px solid rgba(56,189,248,.2)}
  [data-color=sky] .card::before{background:#38bdf8}

  [data-color=indigo] .section-icon{background:rgba(129,140,248,.1)}
  [data-color=indigo] .section-title{color:#4f46e5}
  [data-color=indigo] .section-tag{background:rgba(129,140,248,.1);color:#4f46e5;border:1px solid rgba(129,140,248,.2)}
  [data-color=indigo] .card::before{background:#818cf8}

  [data-color=purple] .section-icon{background:rgba(167,139,250,.1)}
  [data-color=purple] .section-title{color:#7c3aed}
  [data-color=purple] .section-tag{background:rgba(167,139,250,.1);color:#7c3aed;border:1px solid rgba(167,139,250,.2)}
  [data-color=purple] .card::before{background:#a78bfa}

  [data-color=orange] .section-icon{background:rgba(249,115,22,.1)}
  [data-color=orange] .section-title{color:#ea580c}
  [data-color=orange] .section-tag{background:rgba(249,115,22,.1);color:#ea580c;border:1px solid rgba(249,115,22,.2)}
  [data-color=orange] .card::before{background:#f97316}

  [data-color=amber] .section-icon{background:rgba(251,191,36,.1)}
  [data-color=amber] .section-title{color:#d97706}
  [data-color=amber] .section-tag{background:rgba(251,191,36,.1);color:#d97706;border:1px solid rgba(251,191,36,.2)}
  [data-color=amber] .card::before{background:#f59e0b}

  [data-color=rose] .section-icon{background:rgba(251,113,133,.1)}
  [data-color=rose] .section-title{color:#e11d48}
  [data-color=rose] .section-tag{background:rgba(251,113,133,.1);color:#e11d48;border:1px solid rgba(251,113,133,.2)}
  [data-color=rose] .card::before{background:#fb7185}

  [data-color=pink] .section-icon{background:rgba(244,114,182,.1)}
  [data-color=pink] .section-title{color:#db2777}
  [data-color=pink] .section-tag{background:rgba(244,114,182,.1);color:#db2777;border:1px solid rgba(244,114,182,.2)}
  [data-color=pink] .card::before{background:#f472b6}

  [data-color=fuchsia] .section-icon{background:rgba(192,132,252,.1)}
  [data-color=fuchsia] .section-title{color:#9333ea}
  [data-color=fuchsia] .section-tag{background:rgba(192,132,252,.1);color:#9333ea;border:1px solid rgba(192,132,252,.2)}
  [data-color=fuchsia] .card::before{background:#c084fc}

  /* Group headers within a section */
  .group-header{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:14px 0 4px;margin-top:12px;border-top:1px solid #eee}
  .group-line{width:4px;height:22px;border-radius:2px;flex-shrink:0}
  .group-label{font-size:15px;font-weight:700;color:#333}
  .group-sublabel{font-size:11px;color:#aaa;font-weight:400;margin-left:4px}
  .parent-card{grid-column:1/-1;border:1.5px solid rgba(0,0,0,.08);background:linear-gradient(135deg,#fafafe,#f5f5ff);display:grid;grid-template-columns:1fr 1fr;gap:0 28px;padding:24px 28px}
  .parent-card .card-name{font-size:20px;grid-column:1;margin-bottom:4px}
  .parent-card .card-name-en{grid-column:1}
  .parent-card .card-desc{grid-column:1}
  .parent-card .card-example{grid-column:1}
  .parent-card .card-extra{grid-column:2}
  .parent-card .card-extra:first-of-type{margin-top:0}
  .parent-card .card-media{grid-column:2}
  .parent-card .card-tags{grid-column:1/-1}

  /* Matrix */
  .matrix-wrap{padding:0 20px 40px}
  .matrix-title{font-size:18px;font-weight:700;text-align:center;margin-bottom:20px;color:#1a1a2e}
  .matrix{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
  .matrix th{padding:10px 8px;background:#f0f0f5;border:1px solid #e0e0e8;font-weight:600;color:#666;text-align:center}
  .matrix td{padding:8px;border:1px solid #e0e0e8;text-align:center;color:#888;vertical-align:middle;line-height:1.5}
  .matrix td.hi{background:rgba(124,58,237,.06);color:#7c3aed}
  .matrix td.med{background:rgba(0,0,0,.02);color:#888}
  .matrix td.lo{color:#bbb}
  .matrix .row-label{background:#f5f5f8;font-weight:600;color:#666;text-align:left;padding-left:12px;width:100px}
  .matrix-note{font-size:11px;color:#999;text-align:center;margin-top:10px}

  /* Summary */
  .summary{padding:20px 20px 60px}
  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .summary-card{background:#fff;border:1px solid #eaeaf0;border-radius:10px;padding:20px;text-align:center}
  .summary-number{font-size:32px;font-weight:900;margin-bottom:2px}
  .summary-label{font-size:12px;color:#555}

  /* Modal */
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.88);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-overlay.active{display:flex}
  .modal-content{position:relative;max-width:900px;width:100%;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee}
  .modal-title{font-size:13px;font-weight:600;color:#333}
  .modal-close{width:26px;height:26px;background:rgba(0,0,0,.05);border:none;border-radius:6px;color:#888;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .modal-close:hover{background:rgba(0,0,0,.1);color:#333}
  .modal-body{padding:0;display:flex;align-items:center;justify-content:center;background:#000;position:relative}
  .modal-body video{max-width:100%;max-height:70vh;outline:none}
  .modal-play-overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;background:rgba(0,0,0,.3);transition:opacity .2s}
  .modal-play-overlay.hidden{opacity:0;pointer-events:none}
  .modal-play-btn{width:56px;height:56px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:transform .15s,background .15s}
  .modal-play-overlay:hover .modal-play-btn{transform:scale(1.1);background:rgba(255,255,255,.25)}
  .modal-play-btn::after{content:'';width:0;height:0;border-style:solid;border-width:10px 0 10px 18px;border-color:transparent transparent transparent #fff;margin-left:3px}
  .modal-footer{padding:8px 16px;border-top:1px solid #eee;font-size:11px;color:#888;display:flex;justify-content:space-between;align-items:center}
  .modal-nav{display:flex;gap:6px}
  .modal-nav button{padding:3px 10px;background:rgba(0,0,0,.04);border:1px solid #ddd;border-radius:4px;color:#888;font-size:11px;cursor:pointer}
  .modal-nav button:hover{background:rgba(0,0,0,.08);color:#333}
  .modal-nav button:disabled{opacity:.3;cursor:not-allowed}

  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:#fff;color:#333;padding:8px 20px;border-radius:8px;font-size:12px;z-index:2000;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none;border:1px solid #e0e0e8;box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .footer{text-align:center;padding:30px 20px;border-top:1px solid #e8e8ee;color:#ccc;font-size:11px}

  /* Mobile nav */
  .mobile-bar{display:none;position:sticky;top:0;z-index:200;background:rgba(245,245,248,.95);backdrop-filter:blur(10px);border-bottom:1px solid #e8e8ee;padding:10px 16px;align-items:center;justify-content:space-between}
  .mobile-bar-title{font-size:14px;font-weight:700;color:#1a1a2e}
  .mobile-bar-btn{padding:6px 14px;background:#fff;border:1px solid #ddd;border-radius:6px;font-size:12px;color:#666;cursor:pointer}
  .mobile-bar-btn:active{background:#f0f0f0}
  .mobile-menu{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:300;background:rgba(0,0,0,.4)}
  .mobile-menu.open{display:block}
  .mobile-menu-panel{position:absolute;top:0;right:0;width:280px;height:100%;background:#fafafa;overflow-y:auto;padding:16px 0;box-shadow:-4px 0 20px rgba(0,0,0,.1)}
  .mobile-menu-close{display:flex;justify-content:flex-end;padding:0 16px 12px}
  .mobile-menu-close button{width:32px;height:32px;border:none;background:rgba(0,0,0,.05);border-radius:6px;font-size:18px;color:#999;cursor:pointer}
  .mobile-menu .sb-part{padding:14px 16px 4px;font-size:11px;font-weight:700;letter-spacing:1px;color:#aaa}
  .mobile-menu .sb-link{display:block;padding:8px 16px 8px 28px;color:#666;font-size:13px;text-decoration:none;cursor:pointer;border-left:2px solid transparent}
  .mobile-menu .sb-link.active{color:#7c3aed;border-left-color:#7c3aed;background:rgba(124,58,237,.04)}
  .mobile-menu .sb-sub{padding-left:40px;font-size:12px;color:#999}

  @media(max-width:900px){
    .sidebar{display:none}
    .layout{display:block}
    .mobile-bar{display:flex}
    .header{padding:32px 16px 8px}
    .header h1{font-size:28px}
    .part{padding:28px 16px 16px}
    .section{padding:0 12px 20px}
    .cards{grid-template-columns:1fr}
    .parent-card{grid-template-columns:1fr;padding:18px}
    .matrix{font-size:10px}
  }

  /* Color HSL Panel — Dark workspace 专业调色台 */
  .color-hsl-panel{background:#fff;border:1px solid #eaeaf0;border-radius:16px;padding:28px 24px 24px;margin-bottom:20px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
  .color-hsl-top{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;padding:0 0 20px;align-items:flex-start}
  .hsl-wheel-wrap,.sv-matrix-wrap{text-align:center}
  .hsl-panel-title{font-size:12px;font-weight:600;color:#999;margin-bottom:14px;letter-spacing:2px;text-transform:uppercase}
  .hsl-wheel{width:280px;height:280px;position:relative;margin:0 auto}
  
  .hsl-wheel-ring-bg{position:absolute;top:50%;left:50%;width:240px;height:240px;transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 0deg,hsl(0,85%,50%),hsl(15,90%,52%),hsl(30,90%,55%),hsl(45,90%,53%),hsl(55,95%,50%),hsl(80,70%,45%),hsl(120,65%,42%),hsl(165,70%,42%),hsl(220,70%,50%),hsl(260,65%,50%),hsl(285,70%,48%),hsl(330,80%,50%),hsl(0,85%,50%));-webkit-mask:radial-gradient(transparent 48%,#000 50%,#000 85%,transparent 87%);mask:radial-gradient(transparent 52%,#000 54%,#000 82%,transparent 84%);opacity:.5;filter:blur(1px)}
  .hsl-dot{position:absolute;width:36px;height:36px;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6);cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);z-index:2;border:2.5px solid rgba(255,255,255,.4);box-shadow:0 3px 12px rgba(0,0,0,.2),0 0 8px currentColor}
  .hsl-dot:hover{transform:translate(-50%,-50%) scale(1.25);border-color:rgba(255,255,255,.6);box-shadow:0 0 28px currentColor,0 4px 16px rgba(0,0,0,.4);z-index:3}
  .hsl-dot.hd-active{transform:translate(-50%,-50%) scale(1.35);border-color:#fff;box-shadow:0 0 36px currentColor,0 0 0 6px rgba(255,255,255,.12);z-index:4}
  .hsl-wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-size:10px;line-height:1.8;pointer-events:auto;z-index:1;cursor:pointer;padding:20px;border-radius:50%}
  .hsl-wheel-center:hover{background:rgba(0,0,0,.03)}
  .hsl-warm-label{color:#e88d3c;font-weight:600;font-size:11px}
  .hsl-cool-label{color:#2d8a9e;font-weight:600;font-size:11px}
  .hsl-neutral-label{color:#aaa;font-size:9px;letter-spacing:1px}
  .hsl-hue-detail{margin-top:20px;background:#f8f8fb;border:1px solid #eaeaf0;border-radius:14px;padding:20px;display:none;position:relative;overflow:hidden}
  .hsl-hue-detail.active{display:block;animation:hslFadeIn .3s ease}
  .hsl-hue-detail::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0;background:var(--accent,#888)}
  .hsl-hue-detail-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .hsl-hue-detail-dot{width:36px;height:36px;border-radius:50%;flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.15)}

const DB_NAME='CinematicVideos',DB_VER=1,STORE='videos';
let db=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE)){const s=d.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});s.createIndex('cardId','cardId',{unique:false})}};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=e=>rej(e)})}
function dbAdd(cid,f){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');const r=tx.objectStore(STORE).add({cardId:cid,name:f.name,type:f.type,size:f.size,blob:f,ts:Date.now()});r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e)})}
function dbGetByCard(cid){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).index('cardId').getAll(cid);r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e)})}
function dbDelete(id){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=e=>rej(e)})}

function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000)}
function fmtSize(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB'}

function countSectionCards(sec){let n=0;if(sec.cards)n=sec.cards.length;if(sec.parent)n++;if(sec.groups)sec.groups.forEach(g=>n+=g.cards.length);return n}
function render(){
  const app=document.getElementById('app');
  const sidebar=document.getElementById('sidebar');
  app.innerHTML='';
  sidebar.innerHTML='';
  let totalCards=0;
  let secIndex=0;
  let sidebarHtml='';let lastGroup='';

    const partEl=document.createElement('div');

    app.appendChild(partEl);

    if(part.group&&part.group!==lastGroup){lastGroup=part.group;const gl={'camera':'摄影剪辑','lighting':'灯光','sound':'声音设计','color':'色彩','art':'美术'};sidebarHtml+=`<div class="sb-part" data-group="${part.group}" style="padding-top:16px;color:#7c3aed;font-size:10px;border-top:${lastGroup==='camera'?'none':'1px solid #eee'};margin-top:8px">${gl[part.group]||part.group}</div>`}
      sidebarHtml+=`<div class="sb-part" data-group="${part.group||'camera'}">${part.num?part.num+' ':''}${part.title}</div>`;

    part.sections.forEach(sec=>{
      const sid='sec-'+secIndex;
      secIndex++;
      const secEl=document.createElement('div');

      secEl.id=sid;
      secEl.setAttribute('data-color',sec.color);
      secEl.innerHTML=`<div class="section-header"><div class="section-icon">${sec.icon}</div><div><span class="section-title">${sec.title}</span><span class="section-subtitle">${sec.subtitle}</span></div><span class="section-tag">${sec.tag}</span></div><div class="cards"></div>`;
      app.appendChild(secEl);
      const cardsEl=secEl.querySelector('.cards');

      sidebarHtml+=`<a class="sb-link" data-group="${part.group||'camera'}" data-target="${sid}" onclick="document.getElementById('${sid}').scrollIntoView({behavior:'smooth',block:'start'})">${sec.title}</a>`;

      function addCard(c,isParent){
        totalCards++;
        const card=document.createElement('div');
        card.className='card'+(isParent?' parent-card':'');
        const tagsHtml=c.tags.map(t=>{const[cls,label]=t.split(':');return`<span class="tag ${cls}">${label}</span>`}).join('');
        card.innerHTML=`<div class="card-name">${c.en}</div><div class="card-name-en">${c.name}</div><div class="card-desc">${c.desc}</div><div class="card-example"><strong>案例：</strong>${c.example}</div>${c.cognition?`<div class="card-extra card-cognition">${c.cognition}</div>`:''}${c.usage?`<div class="card-extra card-usage">${c.usage}</div>`:''}<div class="card-media"><label class="upload-btn"><input type="file" accept="video/*" multiple>+ 上传视频</label><div class="video-gallery" id="gallery-${c.id}"></div></div><div class="card-tags">${tagsHtml}</div>`;
        cardsEl.appendChild(card);
        const mediaEl=card.querySelector('.card-media'),fi=mediaEl.querySelector('input');
        mediaEl.addEventListener('dragover',e=>{e.preventDefault()});
        mediaEl.addEventListener('drop',e=>{e.preventDefault();handleFiles(c.id,e.dataTransfer.files)});
        fi.addEventListener('change',e=>{handleFiles(c.id,e.target.files);e.target.value=''});
      }

      if(sec.visualType==='shot-size-chart'&&sec.cards){
        const onelinerMap={'advancing-pattern':'大→小，聚焦主体','retreating-pattern':'小→大，情绪着陆','circular-pattern':'大→小→大，张弛交替','leaping-pattern':'大⇄小硬切，极端张力','accumulating-pattern':'同景别重复，蓄积情绪'};
        const chartGrid=document.createElement('div');
        chartGrid.className='shot-size-grid';
        sec.cards.forEach(c=>{
          totalCards++;
          const barsHtml=c.shotSizes.map(s=>`<div class="shot-size-bar" style="height:${s*20}%"></div>`).join('');
          const item=document.createElement('div');
          item.className='shot-size-item';
          item.innerHTML=`<div class="shot-size-item-name">${c.name}</div><div class="shot-size-item-en">${c.en}</div><div class="shot-size-bars">${barsHtml}</div><div class="shot-size-oneliner">${onelinerMap[c.id]||''}</div><div class="shot-size-detail"><div class="card-desc">${c.desc}</div><div class="card-example"><strong>案例：</strong>${c.example}</div>${c.cognition?`<div class="card-extra card-cognition">${c.cognition}</div>`:''}${c.usage?`<div class="card-extra card-usage">${c.usage}</div>`:''}<div class="card-tags" style="margin-top:8px">${c.tags.map(t=>{const[cls,label]=t.split(':');return`<span class="tag ${cls}">${label}</span>`}).join('')}</div></div>`;
          item.addEventListener('click',function(e){if(!item.classList.contains('expanded')){document.querySelectorAll('.shot-size-item.expanded').forEach(el=>el.classList.remove('expanded'));item.classList.add('expanded')}else if(e.target===item||e.target.classList.contains('shot-size-item-name')){item.classList.remove('expanded')}});
          chartGrid.appendChild(item);
        });
        secEl.appendChild(chartGrid);
        cardsEl.style.display='none';
      } else if(sec.visualType==='sound-tracks'&&sec.tracks){
        const wrap=document.createElement('div');
        wrap.className='tracks-wrap';
        const container=document.createElement('div');
        container.className='tracks-container';
        container.innerHTML='<div class="tracks-header"><span class="tracks-header-title">TRACKS</span><span class="tracks-header-hint">点击轨道展开详情</span></div>';
        function genWave(color,style){
          let bars='';const n=150;
          for(let i=0;i<n;i++){
            let h;
            if(style==='speech')h=Math.random()>.3?(15+Math.random()*70):8;
            else if(style==='foley')h=Math.random()>.7?(25+Math.random()*55):6;
            else if(style==='sfx')h=Math.random()>.88?(40+Math.random()*55):4;
            else if(style==='ambient')h=18+Math.random()*18;
            else if(style==='music')h=22+Math.sin(i*.12)*18+Math.random()*12;
            else h=10+Math.random()*40;
            const opacity=0.5+h/200;
            bars+=`<div class="track-wave-bar" style="height:${h}%;background:${color};opacity:${opacity.toFixed(2)}"></div>`;
          }
          return bars;
        }
        sec.tracks.forEach(tr=>{
          totalCards++;
          const trackEl=document.createElement('div');
          trackEl.className='track';
          trackEl.id=tr.id;
          let detailHtml='<div class="track-detail"><div class="track-detail-inner">';
          detailHtml+=`<div class="track-detail-desc">${tr.desc}</div>`;
          if(tr.subtracks){
            detailHtml+='<div class="track-subtracks">';
            tr.subtracks.forEach(st=>{detailHtml+=`<div class="track-subtrack"><b>${st.name}</b><span class="track-subtrack-en">${st.en}</span><br><span style="font-size:11px;color:#888">${st.desc}</span></div>`;});
            detailHtml+='</div>';
          }
          if(tr.example){detailHtml+=`<div class="card-example" style="margin-bottom:10px"><strong>案例：</strong>${tr.example}</div>`;}
          if(tr.designNote){detailHtml+=`<div class="card-extra card-cognition" style="margin-bottom:10px">${tr.designNote}</div>`;}
          if(tr.voiceSpectrum){
            detailHtml+=`<div style="margin:14px 0 10px;padding:12px;background:#f0f9ff;border-radius:8px;border:1px solid #bae6fd"><div style="font-size:12px;font-weight:600;color:#0284c7;margin-bottom:8px">人声光谱 · 从公开到私密</div><div style="display:flex;height:32px;border-radius:6px;overflow:hidden;font-size:10px;color:#fff;text-align:center;line-height:32px"><div style="flex:3;background:#3b82f6">对白</div><div style="flex:2;background:#6366f1">独白</div><div style="flex:2;background:#8b5cf6">旁白</div><div style="flex:2;background:#a855f7;opacity:.8">内心独白</div></div><div style="display:flex;justify-content:space-between;font-size:9px;color:#93c5fd;margin-top:4px"><span>← 最公开 · 角色→角色</span><span>最私密 · 角色思维→观众 →</span></div></div>`;
          }
          if(tr.matrixData){
            const md=tr.matrixData;
            let mhtml='<div style="margin:10px 0"><div style="font-size:12px;font-weight:600;color:#0284c7;margin-bottom:8px">台词节奏</div><table class="voice-matrix"><tr><th></th>';
            md.columns.forEach(c=>mhtml+=`<th>${c}</th>`);mhtml+='</tr>';
            md.rows.forEach(r=>{mhtml+=`<tr><td class="vm-name">${r.name}<span class="vm-name-en">${r.en}</span></td>`;r.cells.forEach((c,i)=>{mhtml+=`<td class="${i===1?'vm-example':''}">${c}</td>`;});mhtml+='</tr>';});
            mhtml+='</table></div>';detailHtml+=mhtml;
          }
          if(tr.tagGroups){
            detailHtml+='<div style="margin:10px 0"><div style="font-size:12px;font-weight:600;color:#0284c7;margin-bottom:8px">声音质感</div><div style="display:flex;flex-wrap:wrap;gap:6px">';
            tr.tagGroups.forEach(tg=>{
              tg.tags.forEach(t=>{detailHtml+=`<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:11px;background:${tg.color}10;border:1px solid ${tg.color}30;color:${tg.color};cursor:help" title="${t.desc} — ${t.example}"><b>${t.name}</b><span style="color:#aaa;font-size:10px">${t.en}</span></span>`;});
            });
            detailHtml+='</div></div>';
          }
          if(tr.techniques){
            detailHtml+='<div style="margin:10px 0"><div style="font-size:12px;font-weight:600;color:#7c3aed;margin-bottom:8px">配乐技法</div><div class="track-subtracks">';
            tr.techniques.forEach(t=>{detailHtml+=`<div class="track-subtrack" style="max-width:320px"><b>${t.name}</b><span class="track-subtrack-en">${t.en}</span><br><span style="font-size:11px;color:#888">${t.desc}</span><br><span style="font-size:10px;color:#aaa;font-style:italic">${t.example}</span></div>`;});
            detailHtml+='</div></div>';
          }
          if(tr.functions){
            detailHtml+='<div style="margin:10px 0"><div style="font-size:12px;font-weight:600;color:#7c3aed;margin-bottom:8px">配乐功能</div>';
            tr.functions.forEach(fn=>{
              detailHtml+=`<div style="margin-bottom:12px;padding:10px 14px;background:#f8f8fb;border-radius:8px;border-left:3px solid #c084fc"><div style="font-size:13px;font-weight:600;color:#7c3aed;margin-bottom:4px">${fn.name}</div><div style="font-size:11.5px;color:#666;line-height:1.6">${fn.desc}</div><div style="font-size:10.5px;color:#888;font-style:italic;margin-top:4px">案例：${fn.example}</div>`;
              if(fn.sliders){
                detailHtml+='<div class="emotion-sliders" style="margin-top:8px">';
                fn.sliders.forEach(s=>{detailHtml+=`<div class="emotion-slider"><div class="emotion-slider-label">${s.label}</div><div class="emotion-slider-bar"><div class="emotion-slider-fill" style="background:${s.color};width:50%"></div></div><div class="emotion-slider-ends"><span>${s.left}</span><span>${s.right}</span></div></div>`;});
                detailHtml+='</div>';
              }
              detailHtml+='</div>';
            });
            detailHtml+='</div>';
          }
          detailHtml+='</div></div>';
          trackEl.innerHTML=`<div class="track-bar"><div class="track-label">${tr.label}<span class="track-sublabel">${tr.sublabel}</span></div><div class="track-wave">${genWave(tr.color,tr.waveStyle)}</div><span class="track-arrow">▸</span></div>${detailHtml}`;
          trackEl.querySelector('.track-bar').addEventListener('click',()=>{
            const wasActive=trackEl.classList.contains('track-active');
            container.querySelectorAll('.track.track-active').forEach(el=>el.classList.remove('track-active'));
            if(!wasActive){trackEl.classList.add('track-active');trackEl.scrollIntoView({behavior:'smooth',block:'nearest'})}
          });
          container.appendChild(trackEl);
        });
        wrap.appendChild(container);
        secEl.appendChild(wrap);
        cardsEl.style.display='none';
      } else if(sec.visualType==='color-sliders'&&sec.cards){
        // === HSL Visual Panel: Donut Wheel + SV Matrix + Theory ===
        const vizPanel=document.createElement('div');vizPanel.className='color-hsl-panel';
        // Build 12-color wheel with donut ring background
        const wheelR=105,wheelC=140,wheelSize=280;
        const hueRing=[{h:0,hsl:0,n:'红',t:1},{h:30,hsl:15,n:'红橙',t:3},{h:60,hsl:30,n:'橙',t:2},{h:90,hsl:45,n:'黄橙',t:3},{h:120,hsl:55,n:'黄',t:1},{h:150,hsl:80,n:'黄绿',t:3},{h:180,hsl:120,n:'绿',t:2},{h:210,hsl:165,n:'蓝绿',t:3},{h:240,hsl:220,n:'蓝',t:1},{h:270,hsl:260,n:'蓝紫',t:3},{h:300,hsl:285,n:'紫',t:2},{h:330,hsl:330,n:'红紫',t:3}];
        const dotsHtml=hueRing.map(({h,hsl,n,t})=>{const a=(h-90)*Math.PI/180;const x=wheelC+wheelR*Math.cos(a);const y=wheelC+wheelR*Math.sin(a);const sz=t===1?44:t===2?36:30;const fs=t===1?13:t===2?11:9;const bdr=t===1?'3px solid rgba(255,255,255,.6)':t===2?'2.5px solid rgba(255,255,255,.4)':'2px solid rgba(255,255,255,.25)';return`<div class="hsl-dot" data-hue="${h}" data-hsl="${hsl}" data-tier="${t}" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${sz}px;height:${sz}px;font-size:${fs}px;border:${bdr};background:hsl(${hsl},80%,52%)">${n}</div>`}).join('');
        const topHtml=`<div class="color-hsl-top"><div class="hsl-wheel-wrap"><div class="hsl-panel-title">12色环 · 点击探索每种颜色</div><div class="hsl-wheel" style="width:${wheelSize}px;height:${wheelSize}px"><div class="hsl-wheel-ring-bg"></div>${dotsHtml}<div class="hsl-wheel-center"><span class="hsl-warm-label">暖色系</span><br><span class="hsl-neutral-label">中性色</span><br><span class="hsl-cool-label">冷色系</span></div></div><div class="hsl-hue-detail" id="hslHueDetail"></div></div></div>`;
        const theoryHtml=`<div class="hsl-theory"><div class="hsl-theory-title">HSL 调色原理：减互补色，加相近色</div><p>HSL 色彩空间中，<b>H</b>(色相) 决定颜色、<b>S</b>(饱和度) 决定鲜灰、<b>L</b>(明度) 决定亮暗。调色师调整色相的核心手法：</p><p><b>加相近色</b>——在色轮上添加相邻颜色，将色相向目标方向偏移。例如红色中加入黄色 → 色相偏向橙色。</p><div class="ht-example"><div class="ht-dot" style="background:#ef4444"></div><span class="ht-arrow">+</span><div class="ht-dot" style="background:#eab308"></div><span class="ht-arrow">→</span><div class="ht-dot" style="background:#f97316"></div><span class="ht-label">红 + 黄 → 橙</span></div><p><b>减互补色</b>——减去色轮对面的互补色，等效于加强当前色相。例如减青让画面偏暖。在调色软件中，"减某色"就是把色轮往反方向推。</p><div class="ht-example"><div class="ht-dot" style="background:#888"></div><span class="ht-arrow">−</span><div class="ht-dot" style="background:#2d8a9e"></div><span class="ht-arrow">→</span><div class="ht-dot" style="background:#e88d3c"></div><span class="ht-label">中性灰 − 青 → 偏暖橙</span></div><p>两者是同一枚硬币的两面：想让画面偏暖，可以<b>加橙/黄</b>(加相近色)，也可以<b>减蓝/青</b>(减互补色)，效果等价。DaVinci Resolve 的色轮控制器正是基于这个原理——拖向某个方向 = 加该色 + 减其对面色。</p></div>`;
        vizPanel.innerHTML=topHtml+theoryHtml;
        secEl.appendChild(vizPanel);
        // Wire up interactive wheel: click dot → show hue detail from hueCards
        if(sec.hueCards){
          const hueDetailEl=vizPanel.querySelector('#hslHueDetail');
          const dots=vizPanel.querySelectorAll('.hsl-dot');
          dots.forEach(dot=>{
            dot.addEventListener('click',function(){
              const hVal=parseInt(dot.dataset.hue);const hslVal=parseInt(dot.dataset.hsl||dot.dataset.hue);
              const hc=sec.hueCards.find(c=>c.h===hVal)||(hVal===-1?sec.hueCards.find(c=>c.h===-1):null);
              if(!hc){
                const closest=sec.hueCards.filter(c=>c.h>=0).reduce((best,c)=>Math.abs(c.h-hVal)<Math.abs(best.h-hVal)?c:best);
                showHueDetail(closest,dot);
              } else { showHueDetail(hc,dot); }
            });
          });
          function showHueDetail(hc,activeDot){
            dots.forEach(d=>d.classList.remove('hd-active'));
            activeDot.classList.add('hd-active');
            const tagsHtml=hc.tags.map(t=>{const[cls,label]=t.split(':');return`<span class="tag ${cls}">${label}</span>`}).join('');
            const dotBg=hc.hue.startsWith('linear')?hc.hue:hc.hue;
            hueDetailEl.innerHTML=`<div class="hsl-hue-detail-header"><div class="hsl-hue-detail-dot" style="background:${dotBg}"></div><span class="hsl-hue-detail-name">${hc.name}</span><span class="hsl-hue-detail-en">${hc.en}</span></div><div class="card-desc">${hc.desc}</div><div class="card-example"><strong>案例：</strong>${hc.example}</div>${hc.cognition?`<div class="card-extra card-cognition">${hc.cognition}</div>`:''}<div class="card-tags" style="margin-top:8px">${tagsHtml}</div>`;
            hueDetailEl.style.setProperty('--accent',hc.hue.startsWith('linear')?'#888':hc.hue);
            hueDetailEl.querySelector('.hsl-hue-detail::before')||true;
            hueDetailEl.style.setProperty('--accent',hc.hue.startsWith('linear')?'#888':hc.hue);
            hueDetailEl.classList.add('active');

          }
          // Also add achromatic as center click

          if(centerEl){centerEl.style.pointerEvents='auto';centerEl.style.cursor='pointer';
            centerEl.addEventListener('click',function(){
              const ac=sec.hueCards.find(c=>c.h===-1||c.id==='hue-achromatic');
              if(ac){dots.forEach(d=>d.classList.remove('hd-active'));
                const tagsHtml=ac.tags.map(t=>{const[cls,label]=t.split(':');return`<span class="tag ${cls}">${label}</span>`}).join('');
                hueDetailEl.innerHTML=`<div class="hsl-hue-detail-header"><div class="hsl-hue-detail-dot" style="background:${ac.hue}"></div><span class="hsl-hue-detail-name">${ac.name}</span><span class="hsl-hue-detail-en">${ac.en}</span></div><div class="card-desc">${ac.desc}</div><div class="card-example"><strong>案例：</strong>${ac.example}</div>${ac.cognition?`<div class="card-extra card-cognition">${ac.cognition}</div>`:''}<div class="card-tags" style="margin-top:8px">${tagsHtml}</div>`;
                hueDetailEl.style.borderColor='#999';hueDetailEl.classList.add('active');
              }

        }
        cardsEl.style.display='none';
      } else if(sec.visualType==='color-wheel'&&sec.cards){
        const hueGrid=document.createElement('div');hueGrid.className='color-hue-grid';
        sec.cards.forEach(c=>{totalCards++;const item=document.createElement('div');item.className='color-hue-item';
          const circleStyle=c.hue.startsWith('linear')?`background:${c.hue}`:`background:${c.hue}`;
          item.innerHTML=`<div class="color-hue-circle" style="${circleStyle}"></div><div class="color-hue-name">${c.name}</div><span class="color-hue-en">${c.en}</span><div class="color-hue-detail"><div class="card-desc">${c.desc}</div><div class="card-example"><strong>案例：</strong>${c.example}</div>${c.cognition?`<div class="card-extra card-cognition">${c.cognition}</div>`:''}${c.usage?`<div class="card-extra card-usage">${c.usage}</div>`:''}<div class="card-tags" style="margin-top:8px">${c.tags.map(t=>{const[cls,label]=t.split(':');return`<span class="tag ${cls}">${label}</span>`}).join('')}</div></div>`;
          item.addEventListener('click',function(e){if(!item.classList.contains('ch-expanded')){document.querySelectorAll('.color-hue-item.ch-expanded').forEach(el=>el.classList.remove('ch-expanded'));item.classList.add('ch-expanded')}else if(e.target===item||e.target.classList.contains('color-hue-name')){item.classList.remove('ch-expanded')}});
          hueGrid.appendChild(item)});
        secEl.appendChild(hueGrid);cardsEl.style.display='none';
      } else if(sec.visualType==='color-swatches'&&sec.cards){
        const swatchGrid=document.createElement('div');swatchGrid.className='color-swatch-grid';
        const hslMap={0:0,30:15,60:30,90:45,120:55,150:80,180:120,210:165,220:210,240:220,260:250,270:260,300:285,330:330};
        function miniWheel(wm,swColors){

        <tr>
          <td class="ct-problem">方向不匹配<span class="ct-problem-en">Direction Mismatch</span></td>
          <td class="ct-symptom">角色在A镜头向右走出画面，B镜头却从右侧走入 — 看起来像掉头了</td>
          <td>入画/出画方向不一致，违反运动连贯性预期</td>
          <td class="ct-fix">出画方向=下一镜头入画方向（右出→左入）。或用正面/背面镜头做方向中性的过渡</td>
        </tr>
        <tr>
          <td class="ct-problem">位置跳变<span class="ct-problem-en">Position Jump</span></td>
          <td class="ct-symptom">同一角色在相邻镜头中的画面位置突然跳变（从左侧跳到右侧）</td>
          <td>不同机位拍摄时角色在画面中的位置不连贯</td>
          <td class="ct-fix">注意角色在画面中的位置比例保持一致，或用运动/动作匹配掩盖位置变化</td>
        </tr>
        <tr>
          <td class="ct-problem">动作不连贯<span class="ct-problem-en">Action Discontinuity</span></td>
          <td class="ct-symptom">角色举杯的手在切换镜头后突然放下了，或门开了一半又变成关着的</td>
          <td>不同take之间演员动作不完全一致，场记（Script Supervisor）未能捕捉到差异</td>
          <td class="ct-fix">① 切在动作最快处（运动模糊掩盖差异）。② 用反应镜头/插入镜头跳过不连贯的帧。③ 前期依赖场记严格记录每个take的动作细节</td>
        </tr>
      </table>
    </div>
  </div>`;
  const lightingPart3=app.querySelector('[data-group="lighting"]');
  if(lightingPart3){lightingPart3.insertAdjacentHTML('beforebegin',continuityHtml)}
  else{app.insertAdjacentHTML('beforeend',continuityHtml)}

  sidebarHtml+=`<a class="sb-link" data-group="camera" data-target="${continuityId}" onclick="document.getElementById('${continuityId}').scrollIntoView({behavior:'smooth',block:'start'})">连贯性规则</a>`;

  // Summary
  function countCards(sections){return sections.reduce((a,s)=>{let n=0;if(s.cards)n+=s.cards.length;if(s.parent)n+=1;if(s.groups)s.groups.forEach(g=>n+=g.cards.length);return a+n},0)}
  const p1=countCards(PARTS[0].sections);
  const p2=countCards(PARTS[1].sections);
  const p3=countCards(PARTS[2].sections);
  const pRhythm=countCards(PARTS[3].sections);
  const p4=6;
  app.insertAdjacentHTML('beforeend',`
  <div class="summary" data-group="camera"><div class="summary-grid">
    <div class="summary-card"><div class="summary-number" style="color:#4ade80">${p1}</div><div class="summary-label">单镜头技法</div></div>
    <div class="summary-card"><div class="summary-number" style="color:#fbbf24">${p2}</div><div class="summary-label">多镜头技法</div></div>
    <div class="summary-card"><div class="summary-number" style="color:#c084fc">${p3}</div><div class="summary-label">交叉地带</div></div>
    <div class="summary-card"><div class="summary-number" style="color:#ec4899">${pRhythm}</div><div class="summary-label">剪辑节奏</div></div>
    <div class="summary-card"><div class="summary-number" style="color:#f472b6">${p4}</div><div class="summary-label">编辑范式</div></div>
    <div class="summary-card"><div class="summary-number" style="color:#1a1a2e">${totalCards+p4}</div><div class="summary-label">技法总计</div></div>
  </div></div>`);

  app.insertAdjacentHTML('beforeend','<div class="footer">镜头语言全图鉴 — Cinematic Language Complete Reference</div>');

  // Build sidebar + mobile menu
  sidebar.innerHTML=sidebarHtml;
  // Reorder: move Part 4 entries before the lighting group header
  const lightingHeader=sidebar.querySelector('[data-group="lighting"].sb-part');
  if(lightingHeader){
    const p4Elements=[];
    sidebar.querySelectorAll('[data-group="camera"]').forEach(el=>{
      if(el.textContent.includes('PART 5')||el.textContent.includes('配对矩阵')||el.textContent.includes('编辑范式')||el.textContent.includes('连贯性规则')){
        p4Elements.push(el);
      }
    });
    p4Elements.forEach(el=>lightingHeader.parentNode.insertBefore(el,lightingHeader));
  }
  const mobilePanel=document.getElementById('mobileMenuPanel');
  const closeBtn=mobilePanel.querySelector('.mobile-menu-close').outerHTML;
  const mobileLinks=sidebarHtml.replace(/onclick="[^"]*"/g,(m)=>{
    return m.replace('")',';document.getElementById(\'mobileMenu\').classList.remove(\'open\')")');
  });
  mobilePanel.innerHTML=closeBtn+mobileLinks;

  // IntersectionObserver for sidebar highlight
  const secObserver=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        document.querySelectorAll('.sb-link').forEach(l=>l.classList.remove('active'));
        const link=document.querySelector(`.sb-link[data-target="${e.target.id}"]`);
        if(link){
          link.classList.add('active');
          link.scrollIntoView({block:'nearest',behavior:'smooth'});
        }
      }
    });
  },{threshold:0.1,rootMargin:'-10% 0px -80% 0px'});

  document.querySelectorAll('.section, .matrix-wrap, .group-header').forEach(el=>{
    if(el.id) secObserver.observe(el);
  });
}

async function handleFiles(cid,files){for(const f of files){if(!f.type.startsWith('video/')){showToast('请上传视频文件');continue}await dbAdd(cid,f)}showToast(`已添加 ${files.length} 个视频`);loadGallery(cid)}
async function loadGallery(cid){const g=document.getElementById(`gallery-${cid}`);if(!g)return;const vs=await dbGetByCard(cid);g.innerHTML='';vs.forEach((v,i)=>{const url=URL.createObjectURL(v.blob);const t=document.createElement('div');t.className='video-thumb';t.innerHTML=`<video src="${url}" preload="metadata" muted></video><div class="play-icon"></div><button class="delete-btn">&times;</button><div class="vid-label">${v.name}</div>`;const vid=t.querySelector('video');vid.addEventListener('loadedmetadata',()=>{vid.currentTime=Math.min(1,vid.duration*.1)});t.addEventListener('click',e=>{if(e.target.classList.contains('delete-btn'))return;openModal(cid,i)});t.querySelector('.delete-btn').addEventListener('click',async e=>{e.stopPropagation();await dbDelete(v.id);URL.revokeObjectURL(url);showToast('已删除');loadGallery(cid)});g.appendChild(t)})}

// Modal
let ms={cardId:null,index:0,videos:[]};
async function openModal(cid,i){const vs=await dbGetByCard(cid);if(!vs.length)return;ms={cardId:cid,index:i,videos:vs};showMV();document.getElementById('videoModal').classList.add('active')}
function showMV(){const{index:i,videos:vs,cardId:cid}=ms;const v=vs[i];const vid=document.getElementById('modalVideo');let name=cid;PARTS.forEach(p=>p.sections.forEach(s=>{if(s.cards)s.cards.forEach(c=>{if(c.id===cid)name=c.name});if(s.parent&&s.parent.id===cid)name=s.parent.name;if(s.groups)s.groups.forEach(g=>g.cards.forEach(c=>{if(c.id===cid)name=c.name}))}));if(vid._u)URL.revokeObjectURL(vid._u);const u=URL.createObjectURL(v.blob);vid._u=u;vid.src=u;vid.load();document.getElementById('modalPlayOverlay').classList.remove('hidden');document.getElementById('modalTitle').textContent=`${name} — ${v.name}`;document.getElementById('modalInfo').textContent=`${i+1}/${vs.length} · ${fmtSize(v.size)}`;document.getElementById('modalPrev').disabled=i===0;document.getElementById('modalNext').disabled=i===vs.length-1}
function closeModal(){const v=document.getElementById('modalVideo');v.pause();if(v._u){URL.revokeObjectURL(v._u);v._u=null}v.removeAttribute('src');v.load();document.getElementById('videoModal').classList.remove('active')}

document.getElementById('modalClose').addEventListener('click',closeModal);
document.getElementById('videoModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
document.getElementById('modalPlayOverlay').addEventListener('click',()=>{const v=document.getElementById('modalVideo');v.muted=false;v.volume=1;v.currentTime=0;const p=v.play();if(p&&p.catch)p.catch(()=>{v.muted=true;v.play();showToast('请点击喇叭图标取消静音')});document.getElementById('modalPlayOverlay').classList.add('hidden')});
document.getElementById('modalVideo').addEventListener('ended',()=>document.getElementById('modalPlayOverlay').classList.remove('hidden'));
document.getElementById('modalVideo').addEventListener('play',()=>document.getElementById('modalPlayOverlay').classList.add('hidden'));
document.getElementById('modalPrev').addEventListener('click',()=>{if(ms.index>0){ms.index--;showMV()}});
document.getElementById('modalNext').addEventListener('click',()=>{if(ms.index<ms.videos.length-1){ms.index++;showMV()}});
document.addEventListener('keydown',e=>{if(!document.getElementById('videoModal').classList.contains('active'))return;if(e.key==='Escape')closeModal();if(e.key==='ArrowLeft'&&ms.index>0){ms.index--;showMV()}if(e.key==='ArrowRight'&&ms.index<ms.videos.length-1){ms.index++;showMV()}});


// Tab switching
function switchGroup(g){
  document.querySelectorAll('.top-tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('[data-group]').forEach(el=>{
    if(g==='all')el.style.display='';
    else el.style.display=el.dataset.group===g?'':'none';
  });

  window.scrollTo(0,0);
}
(async()=>{await openDB();render();PARTS.forEach(p=>p.sections.forEach(s=>{if(s.groups){if(s.parent)loadGallery(s.parent.id);s.groups.forEach(g=>g.cards.forEach(c=>loadGallery(c.id)))}else if(s.cards){s.cards.forEach(c=>loadGallery(c.id))}}))})();
</script>
